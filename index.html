<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         BASIC CONFIGURATION
    ====================================================== -->

    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- =====================================================
         APP INFORMATION
    ====================================================== -->

    <meta
      name="description"
      content="Onishakara - Sales management, sales, inventory, staff, reports and business administration."
    />

    <meta
      name="application-name"
      content="Onishakara"
    />

    <meta
      name="author"
      content="IMVON"
    />

    <meta
      name="keywords"
      content="Onishakara, salon management, salon POS, inventory, sales, staff management, reports"
    />

    <title>Onishakara Manager</title>

    <!-- =====================================================
         PWA MANIFEST
    ====================================================== -->

    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- =====================================================
         THEME
    ====================================================== -->

    <meta
      name="theme-color"
      content="#000000"
    />

    <meta
      name="msapplication-TileColor"
      content="#000000"
    />

    <!-- =====================================================
         MOBILE APP SUPPORT
    ====================================================== -->

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Onishakara Manager"
    />

    <!-- =====================================================
         ICONS
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/assets/img/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/assets/img/icon-192.png"
    />

    <!-- =====================================================
         OPTIONAL: IOS SAFE AREA
    ====================================================== -->

    <meta
      name="format-detection"
      content="telephone=no"
    />
  </head>

  <body>
    <!-- =====================================================
         JAVASCRIPT REQUIRED
    ====================================================== -->

    <noscript>
      <div
        style="
          padding: 40px;
          text-align: center;
          font-family: Arial, sans-serif;
        "
      >
        <h2>Onishakara Manager</h2>

        <p>
          JavaScript is required to use Onishakara Manager.
          Please enable JavaScript and reload the application.
        </p>
      </div>
    </noscript>

    <!-- =====================================================
         REACT ROOT
    ====================================================== -->

    <div id="root"></div>

    <!-- =====================================================
         REACT APPLICATION
    ====================================================== -->

    <script
      type="module"
      src="/src/index.jsx"
    ></script>
  </body>
</html>
